<iframe id="fenster" title="Übersicht"></iframe>
<script>
let passwort = null, schluesselCache = null, inhalt = null, aktuell = "Versand_Uebersicht.html", position = 0;
const fenster = document.getElementById("fenster");
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function schluessel(salz, runden) {
  if (schluesselCache && schluesselCache.salz === salz) return schluesselCache.key;
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:bytes(salz), iterations:runden }, basis, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  schluesselCache = { salz, key };
  return key;
}
async function hole() {
  const antwort = await fetch("daten.json?" + Date.now(), { cache:"no-store" });
  if (!antwort.ok) throw new Error("netz");
  const j = await antwort.json();
  const key = await schluessel(j.salz, j.runden);
  const klar = await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(j.iv) }, key, bytes(j.ct));
  const strom = new Blob([klar]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(strom).text());
}
function zeige(name, merken) {
  try { position = merken ? fenster.contentWindow.scrollY : 0; } catch (e) { position = 0; }
  aktuell = name;
  fenster.srcdoc = inhalt.seiten[name];
}
fenster.addEventListener("load", () => {
  try {
    const dok = fenster.contentDocument;
    fenster.contentWindow.scrollTo(0, position);
    dok.addEventListener("click", e => {
      const a = e.target.closest("a[href]"); if (!a) return;
      const ziel = a.getAttribute("href");
      if (inhalt && inhalt.seiten[ziel]) { e.preventDefault(); zeige(ziel, false); }
    });
  } catch (e) {}
});
async function aktualisieren() {
  try {
    const neu = await hole();
    if (neu.stand === inhalt.stand) return;
    inhalt = neu;
    // Die Aufgabenseite holt sich neue Daten selbst, damit eine angefangene Eingabe nicht verloren geht.
    if (aktuell !== "Aufgaben_Uebersicht.html") zeige(aktuell, true);
  } catch (e) {}
}
// Eingaben vom Handy: im Browser verschlüsseln und ins Postfach legen. Das Postfach sieht nur Geheimtext.
const POSTFACH = "https://qdycgspamxfiurajizmt.supabase.co/rest/v1/aussen_postfach";
const POSTFACH_KEY = "sb_publishable_K44M8guO_OYo0wwu-ckAXA_PVywqElW";
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const FRIST = 3600000;
let wartendNeu = [], wartendStatus = {}, wartendMarken = {};
async function einwerfen(nachricht) {
  const salz = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:salz, iterations:600000 }, basis, { name:"AES-GCM", length:256 }, false, ["encrypt"]);
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(nachricht)));
  const r = await fetch(POSTFACH, { method:"POST", headers:{ apikey:POSTFACH_KEY, "Content-Type":"application/json", Prefer:"return=minimal" }, body:JSON.stringify({ inhalt:JSON.stringify({ salz:b64(salz), iv:b64(iv), ct:b64(ct) }) }) });
  if (!r.ok) throw new Error("Senden nicht möglich. Bitte erneut versuchen.");
}
window.bukaraAussen = {
  marken() {
    const jetzt = Date.now(); let liste = [...(inhalt.marken || [])];
    for (const [nr, w] of Object.entries(wartendMarken)) {
      const da = liste.some(m => m.nr === nr);
      if (jetzt - w.zeit > FRIST || da === w.an) { delete wartendMarken[nr]; continue; }
      liste = w.an ? [...liste, { nr, von:w.von, am:"gerade eben" }] : liste.filter(m => m.nr !== nr);
    }
    return liste;
  },
  async markeSetzen(nr, an, von) {
    const zeit = Date.now();
    await einwerfen({ art:"marke", zeit, von, nr, an });
    wartendMarken[nr] = { zeit, an, von:von + " (mobil)" };
  },
  aufgaben() {
    const jetzt = Date.now(), daten = (inhalt.aufgaben || []).map(a => ({ ...a }));
    wartendNeu = wartendNeu.filter(w => jetzt - w.zeit < FRIST && !daten.some(a => a.ref === w.ref));
    for (const [id, w] of Object.entries(wartendStatus)) {
      const a = daten.find(x => x.id === id);
      if (!a || jetzt - w.zeit > FRIST || a.status === w.status) { delete wartendStatus[id]; continue; }
      a.status = w.status; a.notiz = w.notiz; a.erledigtVon = w.status === "erledigt" ? w.von : ""; a.erledigtAm = w.status === "erledigt" ? "gerade eben" : ""; a.wartet = true;
    }
    return { ich:"Außendienst", personen:inhalt.personen || [], aufgaben:[...daten, ...wartendNeu.map(w => w.aufgabe)] };
  },
  async senden(pfad, daten, von) {
    const zeit = Date.now();
    if (pfad === "api/aufgaben") {
      const ref = crypto.randomUUID();
      await einwerfen({ art:"neu", ref, zeit, von, vorgang:daten.vorgang, an:daten.an, text:daten.text, frist:daten.frist });
      wartendNeu.push({ ref, zeit, aufgabe:{ id:"w" + ref, ref, wartet:true, vorgang:(daten.vorgang.match(/\d{6}/g) || []).join(", "), kunde:"", vorgangStatus:"", text:daten.text, an:daten.an.trim(), frist:daten.frist, status:"offen", von:von + " (mobil)", am:"gerade eben", erledigtVon:"", erledigtAm:"", notiz:"" } });
      return {};
    }
    const id = (pfad.match(/^api\/aufgaben\/([0-9a-f]{32})\/status$/) || [])[1];
    if (!id) throw new Error("Diese Aufgabe wird noch übertragen. Bitte in einigen Minuten erneut versuchen.");
    await einwerfen({ art:"status", id, zeit, von, status:daten.status, notiz:daten.notiz });
    wartendStatus[id] = { zeit, von:von + " (mobil)", status:daten.status, notiz:daten.notiz };
    return {};
  }
};
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const fehler = document.getElementById("fehler"), los = document.getElementById("los"), feld = document.getElementById("pw");
  fehler.textContent = ""; los.disabled = true; passwort = feld.value; schluesselCache = null;
  try {
    inhalt = await hole();
    feld.value = "";
    document.getElementById("anmeldung").style.display = "none";
    fenster.style.display = "block";
    zeige(aktuell, false);
    setInterval(aktualisieren, 120000);
  } catch (err) {
    passwort = null;
    fehler.textContent = err.message === "netz" ? "Daten nicht erreichbar. Bitte später erneut versuchen." : "Passwort falsch.";
  }
  los.disabled = false;
});
